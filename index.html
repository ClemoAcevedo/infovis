<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visualización que muestra cómo los fallecidos por COVID-19 en Chile disminuyen a medida que aumenta la cobertura de vacunación entre 2020 y 2023.">
    <title>COVID-19 en Chile: Fallecidos vs. Vacunados (2020–2023)</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">COVID-19 en Chile: Fallecidos vs. Vacunados (2020–2023)</h1>
        <p class="subtitle">Las muertes disminuyeron en paralelo con la implementación de la campaña masiva de vacunación (promedio 7 días).</p>

        <div class="chart-container" id="chart-container">
            <svg id="chart-root"
                 role="img"
                 aria-label="Gráfico de líneas que muestra cómo los fallecidos por COVID-19 en Chile disminuyen a medida que aumenta el porcentaje de vacunados entre 2020 y 2023."
                 tabindex="0">
            </svg>
            <div class="controls-container">
                <div class="narrative-container">
                    <button class="narrative-btn" id="narrative-btn" title="Ver narrativa completa desde el inicio de la pandemia">
                        📖 Narrativa
                    </button>
                </div>
                <div class="filters-container">
                    <div class="filter-title">Comparar grupos etarios</div>
                    <div class="filter-checkboxes">
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-age-0-39">
                            <span class="checkbox-label age-label">≤39</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-age-40-49">
                            <span class="checkbox-label age-label">40-49</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-age-50-59">
                            <span class="checkbox-label age-label">50-59</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-age-60-69">
                            <span class="checkbox-label age-label">60-69</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-age-70-79">
                            <span class="checkbox-label age-label">70-79</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-age-80-89">
                            <span class="checkbox-label age-label">80-89</span>
                        </label>
                        <label class="filter-checkbox">
                            <input type="checkbox" id="filter-age-90-plus">
                            <span class="checkbox-label age-label">≥90</span>
                        </label>
                        <button class="filter-reset-btn" id="filter-reset-btn">Resetear Filtros</button>
                    </div>
                    <div class="chart-legend" id="chart-legend" aria-hidden="true">
                        <!-- La leyenda se generará dinámicamente -->
                    </div>
                </div>
            </div>
            <div class="sound-progress" id="sound-progress" style="display: none;"></div>
            <div class="no-data-message" id="no-data-message" style="display: none;">
                Seleccione al menos una serie para visualizar datos
            </div>
            <div class="tooltip" id="chart-tooltip" style="display: none;">
                <div class="tooltip-date"></div>
                <div class="tooltip-content"></div>
            </div>
        </div>


    </div>

    <!-- Scripts -->
    <script src="assets/vendor/d3.v7.min.js"></script>
    <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
    <script type="module" src="assets/js/chart.js"></script>
    <script type="module" src="assets/js/sound.js"></script>
    <script type="module">
        import { initChart } from './assets/js/chart.js';

        // Initialize chart when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
        });
    </script>
    <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
import { updateVaccinationDetail } from "./assets/js/chart.js";

// --- Firebase Config del usuario ---
const firebaseConfig = {
  apiKey: "AIzaSyCmYBbVb9DvxYVrJtXxPNITGhpJvy50bbE",
  authDomain: "fisicalizacion-web.firebaseapp.com",
  databaseURL: "https://fisicalizacion-web-default-rtdb.firebaseio.com",
  projectId: "fisicalizacion-web",
  storageBucket: "fisicalizacion-web.firebasestorage.app",
  messagingSenderId: "706447091836",
  appId: "1:706447091836:web:86b14b1462a1cc4d5d81f9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Escuchar actualizaciones del celular
onValue(ref(db, "fisicalizacion/t"), snap => {
  const t = snap.val();
  if (typeof t === "number") {
    updateVaccinationDetail(t);
  }
});
</script>
<div id="qr-control"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
new QRCode(document.getElementById("qr-control"), {
  text: window.location.origin + "/sensor.html",
  width: 128,
  height: 128
});
</script>
<style>
#qr-control {
  position: fixed;
  top: 12px;
  left: 12px;
  width: 128px;
  height: 128px;
  z-index: 1000;
}
#qr-control img,
#qr-control canvas {
  width: 100%;
  height: 100%;
}
</style>
</body>
</html>
