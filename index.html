<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visualización que muestra cómo los fallecidos por COVID-19 en Chile disminuyen a medida que aumenta la cobertura de vacunación entre 2020 y 2023.">
    <title>COVID-19 en Chile: Fallecidos vs. Vacunados (2020–2023)</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <div class="container">
        <h1 class="title">COVID-19 en Chile: Fallecidos vs. Vacunados (2020–2023)</h1>
        <p class="subtitle">Compara la evolución por grupos etarios (promedio 7 días)</p>

        <div class="filters-container">
            <button class="filter-toggle" id="filter-toggle">
                <span class="filter-toggle-icon">⚙</span>
                <span class="filter-toggle-text">Comparar grupos etarios</span>
                <span class="filter-toggle-arrow">▼</span>
            </button>
            <div class="filter-dropdown" id="filter-dropdown" style="display: none;">
                <div class="filter-checkboxes">
                    <label class="filter-checkbox">
                        <input type="checkbox" id="filter-age-0-39">
                        <span class="checkbox-label age-label">≤39</span>
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" id="filter-age-40-49">
                        <span class="checkbox-label age-label">40-49</span>
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" id="filter-age-50-59">
                        <span class="checkbox-label age-label">50-59</span>
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" id="filter-age-60-69">
                        <span class="checkbox-label age-label">60-69</span>
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" id="filter-age-70-79">
                        <span class="checkbox-label age-label">70-79</span>
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" id="filter-age-80-89">
                        <span class="checkbox-label age-label">80-89</span>
                    </label>
                    <label class="filter-checkbox">
                        <input type="checkbox" id="filter-age-90-plus">
                        <span class="checkbox-label age-label">≥90</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="chart-container" id="chart-container">
            <svg id="chart-root"
                 role="img"
                 aria-label="Gráfico de líneas que muestra cómo los fallecidos por COVID-19 en Chile disminuyen a medida que aumenta el porcentaje de vacunados entre 2020 y 2023."
                 tabindex="0">
            </svg>
            <div class="chart-legend" id="chart-legend" style="display: none;">
                <!-- La leyenda se generará dinámicamente -->
            </div>
            <div class="zoom-controls">
                <div class="zoom-helper">🔍 Arrastra o usa la rueda para explorar</div>
                <button class="reset-zoom-btn" id="reset-zoom-btn">Resetear vista</button>
            </div>
            <div class="sound-controls">
                <button class="sound-play-btn" id="sound-play-btn" title="Reproducir sonificación de datos">
                    ▶️ Reproducir Sonificación
                </button>
                <button class="sound-mute-btn" id="sound-mute-btn" title="Silenciar audio">
                    🔇 Silenciar
                </button>
            </div>
            <div class="sound-progress" id="sound-progress" style="display: none;"></div>
            <div class="no-data-message" id="no-data-message" style="display: none;">
                Seleccione al menos una serie para visualizar datos
            </div>
            <div class="tooltip" id="chart-tooltip" style="display: none;">
                <div class="tooltip-date"></div>
                <div class="tooltip-content"></div>
            </div>
        </div>


    </div>

    <!-- Scripts -->
    <script src="assets/vendor/d3.v7.min.js"></script>
    <script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
    <script type="module" src="assets/js/chart.js"></script>
    <script type="module" src="assets/js/sound.js"></script>
    <script type="module">
        import { initChart } from './assets/js/chart.js';

        // Initialize chart when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            initChart();
        });
    </script>
</body>
</html>
