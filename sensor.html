<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control Físico</title>
</head>
<body>
<h2>Control físico — Vacunación</h2>
<p>Inclina el celular para controlar la visualización.</p>
<button id="permit">Permitir sensor</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
import { firebaseConfig } from "./assets/js/firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

document.getElementById("permit").onclick = async () => {
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    await DeviceOrientationEvent.requestPermission();
  }
};

window.addEventListener("deviceorientation", ev => {
  const roll = ev.gamma || 0;        // -90 a 90 (gamma = inclinación lateral)
  const tiltRange = 60;              // Ángulo objetivo para alcanzar valor máximo
  const t = Math.min(1, Math.max(0, roll / tiltRange)); // flat=0, inclinación→1
  set(ref(db, "fisicalizacion/t"), t);
});
</script>
</body>
</html>
